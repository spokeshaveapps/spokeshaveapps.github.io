<h1>Arcade Attic privacy policy</h1>
<p class="muted">Effective 15 November 2026 · Arcade Attic for Android (package <code>com.spokeshaveapps.arcadeattic</code>) · by Spokeshave Apps</p>

<div class="box">
<p><strong>In short:</strong> Arcade Attic is a collection of offline games. Your scores, coins, streaks, settings and
saved games stay on your phone. We have no servers and no accounts, and we cannot see how you play. The free version
shows ads from Google AdMob, which collects some device data under the ad privacy choices you make. Buying Pro removes
ads. Playing with friends connects phones directly to each other, never through us.</p>
</div>

<h2>1. Permissions</h2>
<table>
<tr><th>Permission</th><th>Why</th></tr>
<tr><td>Internet, network state</td><td>Only for ads in the free version, the ad consent form and Google Play purchases. The games themselves work offline.</td></tr>
<tr><td>Google Play billing</td><td>To buy and restore Arcade Attic Pro.</td></tr>
<tr><td>Nearby devices (Bluetooth, Wi-Fi)</td><td>Only for <em>Play with friends</em>, and only when you host or join a game, to find and connect to phones next to you. On Android 13 and later these are marked “never for location”.</td></tr>
<tr><td>Location (Android 12 and older only)</td><td>Older Android versions require it before an app may search for nearby Bluetooth or Wi-Fi devices. Arcade Attic never reads where you are; it is asked only when you start Play with friends.</td></tr>
<tr><td>Advertising ID</td><td>Added by the Google Mobile Ads SDK; see section 4.</td></tr>
</table>
<p>Arcade Attic does not request camera, microphone, contacts, calendar, photos, storage or notification permissions.</p>

<h2>2. What stays on your phone</h2>
<p>In its private app storage, Arcade Attic keeps your scores and best runs, coins, daily challenge and streak history,
achievements, unlocked themes, games in progress, settings and the leaderboard name you choose (leaderboards are
on this phone only). Your Pro status is not stored; it is asked from Google Play.</p>
<p>If Android backup is on for your phone, Android may include this game data in your own Google account backup and in
phone-to-phone transfers, so your progress moves to a new phone. That backup belongs to your Google account; we cannot
see it.</p>

<h2>3. Play with friends</h2>
<p>Play with friends connects two to four phones that are close together, directly, using Google Play services Nearby
Connections (or classic Bluetooth for two phones). No internet connection and no account are used. While you host or
join, nearby phones running Arcade Attic can see your phone’s name (as set in Android settings). During a match, the
phones at the table exchange only what the game needs: the game, the moves, scores and the players’ phone names.
Nothing is sent to us, and nothing is kept after the match apart from your own results on your phone.</p>
<p><strong>Score codes.</strong> When you tap Share score, Arcade Attic builds a message with your score and a short
code, and hands it to the app you choose (for example a chat app). It goes only where you send it.</p>

<h2>4. Ads (free version only)</h2>
<p>The free version shows ads from <strong>Google AdMob</strong>: a banner on the game list and results screens, an
occasional full-screen ad between games, and, only when you tap a “Watch ad” button, a rewarded video (for example to
continue a run, double a daily reward or try a Pro game or theme). Ads never appear while you are playing.</p>
<p>Before any ad request, Arcade Attic uses Google’s User Messaging Platform to ask for consent where the law requires
it (for example in the EEA, UK and Switzerland, and in some US states). You can change your choice any time in
Settings → Ad privacy choices.</p>
<p>When ads are shown, the Google Mobile Ads SDK automatically collects and shares with Google: IP address (which can
indicate approximate location), ad and product interactions, diagnostic information, and device identifiers such as
the Android advertising ID. Google uses this for advertising, analytics and fraud prevention. Learn more:
<a href="https://policies.google.com/technologies/partner-sites">How Google uses information from apps that use its
services</a>. You can reset or delete your advertising ID in Android Settings → Privacy → Ads. Ad content is capped
at Google’s PG maturity rating. Ads never receive your scores, saves or anything about your games.</p>
<p>Arcade Attic Pro users see no ads. Once Google Play confirms your Pro purchase, the ads SDK and consent form are not
started at all.</p>

<h2>5. Purchases</h2>
<p>Arcade Attic Pro is a one-time purchase handled entirely by Google Play. We never see your payment details. The app
receives only whether you own Pro. See the <a href="https://payments.google.com/payments/apis-secure/u/0/get_legal_document?ldo=0&amp;ldt=privacynotice">Google
Payments privacy notice</a>. Coins are earned by playing and cannot be bought.</p>

<h2>6. Bug reports and feature requests</h2>
<p>Settings → Report a bug / Suggest a feature prepares an email in your own email app (or the share sheet). Nothing
is sent until you send it there. It contains what you type and, if you leave the switch on, the app version, phone
model, Android version, screen size, app language, theme and a few settings. If the app crashed in the last seven
days, it offers to add the crash details, which are kept only on your phone until then. It never contains your
accounts, location or advertising ID. We use these emails only to fix bugs and plan features, and delete them when
they are no longer needed.</p>

<h2>7. Analytics</h2>
<p>Arcade Attic contains no analytics service of its own. Statistics, streaks and achievements are counted on your
phone and shown only to you.</p>

<h2>8. Children</h2>
<p>Arcade Attic is not directed at children under 13 and is not designed for them.</p>

<h2>9. Deleting your data</h2>
<p>Remove everything with Android Settings → Apps → Arcade Attic → Storage → Clear storage, or uninstall the app. To
remove a copy in your Google account backup, use Android’s backup settings. To have a feedback email you sent us
deleted, write to the address below.</p>

<h2>10. Changes</h2>
<p>If this policy changes, we will update this page and its effective date before the change applies.</p>
